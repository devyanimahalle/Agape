name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/devyanimahalle/shareplate-backend
  FRONTEND_IMAGE: ghcr.io/devyanimahalle/shareplate-frontend

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha_short }}
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.date }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha_short }}
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.date }}

  deploy:
    name: Deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        run: |
          # Trigger Render deploy hooks
          if [ -n "${{ secrets.RENDER_BACKEND_HOOK }}" ]; then
            curl -s "${{ secrets.RENDER_BACKEND_HOOK }}"
          fi
          if [ -n "${{ secrets.RENDER_FRONTEND_HOOK }}" ]; then
            curl -s "${{ secrets.RENDER_FRONTEND_HOOK }}"
          fi

      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          HEALTH_URL="${{ secrets.DEPLOY_URL || 'http://localhost' }}/api/v1/impact"
          echo "Checking health at: $HEALTH_URL"
          for i in $(seq 1 5); do
            if curl -sf --max-time 10 "$HEALTH_URL"; then
              echo ""
              echo "✅ Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "❌ Health check failed after 5 attempts"
          exit 1
