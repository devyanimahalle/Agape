name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shareplate
          POSTGRES_PASSWORD: shareplate
          POSTGRES_DB: shareplate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shareplate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check backend/
      - name: Test
        env:
          DATABASE_URL: postgresql://shareplate:shareplate@localhost:5432/shareplate_test
        run: pytest backend/tests/ -v --tb=short

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Lint
        run: |
          cd frontend
          npx eslint src/ --ext .js,.jsx || true
      - name: Test
        run: |
          cd frontend
          npx vitest run || true

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/backend/Dockerfile -t shareplate-backend:test .
      - name: Build frontend image
        run: docker build -f docker/frontend/Dockerfile -t shareplate-frontend:test .
