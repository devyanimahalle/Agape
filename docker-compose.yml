version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shareplate
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shareplate}
      POSTGRES_DB: shareplate
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shareplate"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/devyanimahalle/shareplate-backend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://shareplate:${DB_PASSWORD:-shareplate}@db:5432/shareplate
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - private_docs:/app/storage/private
      - proof_docs:/app/storage/proofs
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    image: ghcr.io/devyanimahalle/shareplate-frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
  private_docs:
  proof_docs:
