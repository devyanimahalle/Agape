services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: docker/db.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    user: root
    env_file: docker/backend.env
    environment:
      - DATABASE_URL=postgresql+psycopg2://shareplate:shareplate@db:5432/shareplate
      - PRIVATE_UPLOAD_DIR=/data/private
    volumes:
      - private_uploads:/data/private
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic -c app/db/alembic.ini upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  private_uploads:
