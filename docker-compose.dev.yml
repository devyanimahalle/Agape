version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shareplate
      POSTGRES_PASSWORD: shareplate
      POSTGRES_DB: shareplate
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shareplate"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://shareplate:shareplate@db:5432/shareplate
      SECRET_KEY: dev-secret-key
      CORS_ORIGINS: "*"
    volumes:
      - ./backend:/app/backend
      - private_docs_dev:/app/storage/private
      - proof_docs_dev:/app/storage/proofs
    ports:
      - "8000:8000"
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata_dev:
  private_docs_dev:
  proof_docs_dev:
